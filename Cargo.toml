[package]
name = "zero_chess_net"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Safe Rust chess framework with UCI, legal move generation, and NNUE evaluation"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ZeroChessNet/ZeroChessNet"
keywords = ["chess", "uci", "nnue", "engine"]
categories = ["games"]

[features]
default = []
gpu = ["dep:pollster", "dep:wgpu"]

[dependencies]
pollster = { version = "0.3", optional = true }
wgpu = { version = "0.19", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
